<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
                template="/template/masterTemplate.xhtml">
    <ui:define name="title">#{msgs.logon}</ui:define>
    <ui:define name="content">
        <div class="card" style="max-width:420px;">
            <h3>#{msgs.logon}</h3>
            <form method="post" action="#{facesContext.externalContext.encodeActionURL(request.contextPath.concat('/j_security_check'))}" class="form-stack">
                <div>
                    <h:outputLabel for="j_username" value="#{msgs.username}" styleClass="info-label" />
                    <br />
                    <h:inputText id="j_username" pt:placeholder="#{msgs.username}" pt:required="required" styleClass="input-text" style="width:100%;" />
                </div>
                <div>
                    <h:outputLabel for="j_password" value="#{msgs.password}" styleClass="info-label" />
                    <br />
                    <h:inputSecret id="j_password" pt:placeholder="#{msgs.password}" pt:required="required" styleClass="input-text" style="width:100%;" />
                </div>
                <div>
                    <input type="submit" value="#{msgs.logon}" class="btn-primary" />
                </div>
            </form>
        </div>
    </ui:define>
</ui:composition>
