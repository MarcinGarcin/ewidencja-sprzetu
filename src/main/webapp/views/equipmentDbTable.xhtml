<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/template/masterTemplate.xhtml">
    <ui:define name="title">#{msgs.equipmentTitle}</ui:define>
    <ui:define name="content">
        <h2 class="page-title">#{msgs.equipmentTitle}</h2>
        <div class="card">
            <h:form id="equipmentForm">
                <h:dataTable value="#{equipmentDbController.equipmentList}" var="equip"
                             styleClass="data-table" rowClasses="oddRow,evenRow"
                             captionClass="warningMessage" footerClass="errorMessage">
                    <h:column>
                        <f:facet name="header">#{msgs.colId}</f:facet>
                        <h:outputText value="#{equip.id}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            #{msgs.colAssetTag}
                            <h:commandButton id="sortTagAsc" value="&#8595;" styleClass="btn-secondary">
                                <f:ajax listener="#{equipmentDbController.sort('assetTag', 'asc')}" render="@form" />
                            </h:commandButton>
                            <h:commandButton id="sortTagDesc" value="&#8593;" styleClass="btn-secondary">
                                <f:ajax listener="#{equipmentDbController.sort('assetTag', 'desc')}" render="@form" />
                            </h:commandButton>
                        </f:facet>
                        <h:inputText value="#{equip.assetTag}" rendered="#{equip.edited}" styleClass="input-text" />
                        <h:outputText value="#{equip.assetTag}" rendered="#{not equip.edited}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            #{msgs.colName}
                            <h:commandButton id="sortNameAsc" value="&#8595;" styleClass="btn-secondary">
                                <f:ajax listener="#{equipmentDbController.sort('name', 'asc')}" render="@form" />
                            </h:commandButton>
                            <h:commandButton id="sortNameDesc" value="&#8593;" styleClass="btn-secondary">
                                <f:ajax listener="#{equipmentDbController.sort('name', 'desc')}" render="@form" />
                            </h:commandButton>
                        </f:facet>
                        <h:inputText value="#{equip.name}" rendered="#{equip.edited}" styleClass="input-text" />
                        <h:outputText value="#{equip.name}" rendered="#{not equip.edited}" />
                    </h:column>
                    <h:column>
                        <f:facet name="header">#{msgs.colOwner}</f:facet>
                        <h:inputText value="#{equip.ownerName}" rendered="#{equip.edited}" styleClass="input-text" />
                        <h:outputText value="#{equip.ownerName}" rendered="#{not equip.edited}" />
                    </h:column>
                    <h:column id="kolOperacja">
                        <f:facet name="header">#{msgs.colOperation}</f:facet>
                        <h:selectBooleanCheckbox id="editCheckBox" value="#{equip.edited}" rendered="true">
                            <f:ajax listener="#{equipmentDbController.visibleChange(equip)}" execute="@form" render="@form" />
                        </h:selectBooleanCheckbox>
                        <h:commandButton id="addRow" value="+" styleClass="btn-primary">
                            <f:ajax listener="#{equipmentDbController.addRow()}" execute="@form" render="@form" />
                        </h:commandButton>
                        <h:commandButton id="deleteRow" value="-" styleClass="btn-danger">
                            <f:ajax listener="#{equipmentDbController.deleteRow(equip)}" execute="@form" render="@form" />
                        </h:commandButton>
                    </h:column>
                </h:dataTable>
                <div class="action-bar">
                    <h:commandButton value="#{msgs.btnAddNew}" styleClass="btn-primary">
                        <f:ajax listener="#{equipmentDbController.addRow()}" execute="@form" render="@form" />
                    </h:commandButton>
                    <h:commandButton value="#{msgs.btnRefresh}" styleClass="btn-secondary">
                        <f:ajax listener="#{equipmentDbController.refreshData()}" render="@form" />
                    </h:commandButton>
                </div>
                <h:messages styleClass="errorMessage" />
            </h:form>
        </div>
    </ui:define>
</ui:composition>
