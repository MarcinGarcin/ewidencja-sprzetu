<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                template="/template/masterTemplate.xhtml">
    <ui:define name="title">#{msgs.infoTitle}</ui:define>
    <ui:define name="content">
        <h2 class="page-title">#{msgs.infoTitle}</h2>
        <div class="card">
            <h3>#{appConfigXML.systemName}</h3>
            <div class="info-row">
                <span class="info-label">#{msgs.authorLabel}: </span>
                <h:outputText value="#{appConfigXML.authorName}" />
            </div>
            <div class="info-row">
                <span class="info-label">#{msgs.groupLabel}: </span>
                <h:outputText value="#{appConfigXML.groupName}" />
            </div>
            <div class="info-row">
                <span class="info-label">#{msgs.appVersion}: </span>
                <h:outputText value="#{applicationController.appVersion}" />
            </div>
            <div class="info-row">
                <span class="info-label">#{msgs.sessionsCount}: </span>
                <h:outputText value="#{applicationController.totalSessionsCount}" />
            </div>
            <div class="info-row">
                <span class="info-label">#{msgs.sessionIdLabel}: </span>
                <h:outputText value="#{session.id}" />
            </div>
            <div class="info-row">
                <span class="info-label">#{msgs.combinedStatus}: </span>
                <h:outputText value="#{sessionController.combinedStatus}" />
            </div>
            <div class="action-bar">
                <h:link value="#{msgs.backToMain}" outcome="/views/mainWindow" styleClass="btn-primary" />
            </div>
        </div>
    </ui:define>
</ui:composition>
