<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <f:view locale="#{sessionController.currentLocale}">
        <h:head>
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
            <title><ui:insert name="title">#{msgs.appTitle}</ui:insert></title>
            <h:outputStylesheet library="css" name="cssLayout.css" />
            <h:outputStylesheet library="css" name="styles.css" />
        </h:head>
        <h:body>
            <div id="top">
                <ui:insert name="top">
                    <ui:include src="/templateElements/appHeader.xhtml" />
                </ui:insert>
            </div>
            <div id="wrapper">
                <div id="left">
                    <ui:insert name="left">
                        <div class="menu-title">#{msgs.appTitle}</div>
                        <div class="nav-list">
                            <ui:repeat value="#{sessionController.menuItems}" var="item">
                                <h:link value="#{msgs[item.labelKey]}" outcome="#{item.outcome}" styleClass="nav-link" />
                            </ui:repeat>
                        </div>
                    </ui:insert>
                </div>
                <div id="content">
                    <ui:insert name="content" />
                </div>
            </div>
            <div id="bottom">
                <ui:insert name="bottom">
                    <ui:include src="/templateElements/appFooter.xhtml" />
                </ui:insert>
            </div>
        </h:body>
    </f:view>
</html>
