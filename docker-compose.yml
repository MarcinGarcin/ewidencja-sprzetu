services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itassetdb
      POSTGRES_USER: itasset
      POSTGRES_PASSWORD: itasset_pass
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itasset -d itassetdb"]
      interval: 5s
      timeout: 5s
      retries: 10
